name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Lint
        run: go run ./cmd/gx lint
      - name: Generated code is current
        run: |
          if [ -f drel.yaml ]; then go tool drel generate; fi
          if [ -f gx.toml ]; then go run ./cmd/gx generate; fi
          git diff --exit-code
      - name: Gx check
        if: hashFiles('gx.toml') != ''
        run: go run ./cmd/gx check
      - name: Unit tests
        run: go test ./...

  full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: briefing
          POSTGRES_PASSWORD: briefing
          POSTGRES_DB: briefing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U briefing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://briefing:briefing@localhost:5432/briefing_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Migrate
        run: go run ./cmd/briefing migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          BASE_URL: http://localhost:8080
          SESSION_SECRET: test-secret-test-secret-test-secret
          GITHUB_CLIENT_ID: test
          GITHUB_CLIENT_SECRET: test
          OPENROUTER_API_KEY: test
      - name: Tests with race detector
        run: go test -race -count=1 ./...
