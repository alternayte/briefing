# The source catalog that `briefing seed` loads. Re-running the seed updates
# title, tier and language by (kind, url) and leaves everything else alone.
#
# kind: rss | hn | bluesky
# url: the feed URL; for hn the API endpoint; for bluesky the author handle
# tier: 1 = primary or specialist source, 2 = general news, 3 = user-added
# language: en | fr (default en)
# poll_minutes: optional; the default depends on the kind

# Research and science
- {kind: rss, tier: 1, title: Quanta Magazine, url: "https://www.quantamagazine.org/feed/"}
- {kind: rss, tier: 1, title: Nature, url: "https://www.nature.com/nature.rss"}
